name: tests

on:
  push:
  pull_request:

jobs:
  servers:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Protocol tests (MCP / DAP / gdbserver)
        run: python tests/test_servers.py
      - name: Debugger tests (disassembler / PDB / unwinder / crash dump)
        run: python tests/test_debugger.py
      - name: CLI help
        run: python wineye.py --help
